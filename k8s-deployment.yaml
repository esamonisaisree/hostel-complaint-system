
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hostel-complaint
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hostel-complaint
  template:
    metadata:
      labels:
        app: hostel-complaint
    spec:
      containers:
        - name: hostel-complaint
          image: hostel-complaint-system:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: hostel-complaint-service
spec:
  type: NodePort
  selector:
    app: hostel-complaint
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30080
